<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import recent form</title><style>body{font:16px system-ui;background:#101820;color:#e6edf3;max-width:1000px;margin:30px auto;padding:16px}a{color:#8ecaff}button{padding:10px;margin:8px}pre{white-space:pre-wrap;background:#1d2b38;padding:16px}</style></head><body><a href="/au-captures">Australian Capture Wall</a><h1>Import new recent-form files</h1><p>Save meeting pages in the recent_form folder on core7070. Once synchronized, scan for new files, review matches, then import. Previously imported content is skipped. Unmatched runners are excluded.</p><button id="scan">Scan new files</button><button id="commit" disabled>Import reviewed files</button><p id="status" role="status"></p><pre id="report"></pre><script>
const token='__TOKEN__',get=id=>document.getElementById(id);let preview=null;
async function send(action,data){const r=await fetch('/api/form-import/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Queue-Token':token},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Import failed');return d;}
async function perform(action){get('scan').disabled=true;get('commit').disabled=true;const id=preview;preview=null;try{const d=await send(action,{preview_id:id});get('report').textContent=JSON.stringify(d,null,2);if(action==='preview'){preview=d.files_ready?d.preview_id:null;get('status').textContent=d.files_ready+' new files ready; '+d.skipped_files+' already imported or duplicate.';}else{get('status').textContent='Processed '+d.imported_runners+' new runner entries. Check reports for errors; reload captures after synchronization.';}}catch(e){get('status').textContent=e.message;}finally{get('scan').disabled=false;get('commit').disabled=!preview;}}
get('scan').onclick=()=>perform('preview');get('commit').onclick=()=>perform('commit');
</script></body></html>
